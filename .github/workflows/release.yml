name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      API_PUBLIC_URL: ${{ secrets.API_PUBLIC_URL }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Sync version from tag
        run: node scripts/sync-version-from-tag.cjs "${{ github.ref_name }}"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build backend and packages
        run: pnpm -r --filter "!@mss/desktop" build
      - name: Pack Windows NSIS
        working-directory: apps/desktop
        env:
          GITHUB_ACTIONS: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          RELEASE_WINDOWS_FILE: MusicStreamService-setup.exe
        run: node scripts/pack-win.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/desktop/release/MusicStreamService-setup.exe

  release:
    needs: [windows-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifacts
        run: mv dist/windows-installer/MusicStreamService-setup.exe dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/MusicStreamService-setup.exe
          generate_release_notes: true
