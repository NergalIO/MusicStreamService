name: Android

on:
  push:
    # Теги собирает release.yml. Повторный signed APK здесь только дублирует его и падает по памяти.
    branches:
      - '**'
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/android-signed.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
      - '.github/workflows/android-signed.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: apps/android/gradle/wrapper/gradle-wrapper.properties
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Unit tests and debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:testDebugUnitTest :core:connectors:testDebugUnitTest :core:offline:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  signed-release:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/android-signed.yml
    with:
      artifact_name: android-apk
      apk_name: mss-android.apk
      require_signing: true
    secrets: inherit
