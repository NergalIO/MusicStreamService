# Temporarily disabled — release builds Windows EXE only (see release.yml).
# Re-enable push/pull_request triggers when Android CI is needed again.
name: Android

on:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Assemble debug
        run: chmod +x gradlew && ./gradlew :app:assembleDebug :core:connectors:testDebugUnitTest --no-daemon
